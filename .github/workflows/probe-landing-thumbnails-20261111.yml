name: Probe landing Supabase thumbnail support
on:
  push:
    branches: [perf/landing-hero-fast-20261111]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test optimized images before wiring them
        shell: bash
        run: |
          set -euo pipefail
          base='https://rzlvfuyzofzqghzooqsi.supabase.co/storage/v1'
          for asset in original/1.jpg result/1f.jpg; do
            echo "ASSET $asset"
            curl --fail --silent --show-error -L --retry 2 -H 'Accept: image/webp,image/avif,image/*;q=0.8' \
               -o /tmp/thumb -w 'render_http=%{http_code} bytes=%{size_download} type=%{content_type} time=%{time_total}\n' \
               "$base/render/image/public/samples/$asset?width=720&quality=70&resize=contain" || true
            file /tmp/thumb || true
          done
