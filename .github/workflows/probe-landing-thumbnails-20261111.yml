name: Verify optimized landing hero images
on:
  push:
    branches: [perf/landing-hero-fast-20261111]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate HTML scripts, preview paths and first-pair preload
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'), vm=require('node:vm'), assert=require('node:assert/strict');
          for (const path of ['index.html','404.html']) {
            const html=fs.readFileSync(path,'utf8');
            const scripts=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
            let parsed=0;
            for(const [,attrs,code] of scripts) {
              if(/\bsrc\s*=/.test(attrs)||/\btype\s*=\s*["'](?:application\/json|module)/i.test(attrs)||!code.trim()) continue;
              new vm.Script(code,{filename:path+' inline '+parsed++});
            }
            assert.ok(parsed>=2);
            assert.match(html,/const heroOptimizedBase = heroImageBase\.replace/);
            assert.match(html,/width=960&quality=75&resize=contain/);
            assert.match(html,/ensurePairSources\(activeIndex, true\)/);
            assert.match(html,/window\.setTimeout\(\(\) => \{\s*ensurePairSources\(\(activeIndex \+ 1\) % sets\.length\)/);
            assert.match(html,/data-fallback-src/);
            assert.match(html,/window\.setInterval\(advancePairSet, 4000\)/);
            const pairs=[...html.matchAll(/\{ originalPath: "original\/(\d+)\.jpg", resultPath: "result\/(\d+)f\.jpg" \}/g)];
            assert.equal(pairs.length,7);
            for(let i=0;i<7;i++)assert.equal(pairs[i][1],pairs[i][2]);
            assert.equal((html.match(/rel="preload" as="image"/g)||[]).length,2);
            console.log(path,'validated',parsed,'scripts and',pairs.length,'image pairs');
          }
          NODE
      - name: Check all 14 transformed images
        shell: bash
        run: |
          set -euo pipefail
          base="https://rzlvfuyzofzqghzooqsi.supabase.co/storage/v1/render/image/public/samples"
          total=0
          for id in 1 2 3 4 5 6 7; do
            for asset in "original/${id}.jpg" "result/${id}f.jpg"; do
              meta="$(curl --fail --silent --show-error --location --retry 2 --max-time 25 \
                --header 'Accept: image/webp,image/avif,image/*;q=0.8' \
                --output /tmp/landing-thumb --write-out '%{http_code} %{size_download} %{content_type}' \
                "$base/$asset?width=960&quality=75&resize=contain&v=20261111-perf")"
              echo "$asset $meta"
              read -r status bytes mime <<< "$meta"
              test "$status" = "200"
              test "$mime" = "image/webp"
              test "$bytes" -gt 5000
              test "$bytes" -lt 600000
              total=$((total + bytes))
            done
          done
          echo "14 optimized hero images total bytes=$total"
