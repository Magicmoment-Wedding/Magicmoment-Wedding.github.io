name: Verify style gallery seven pairs in production
on:
  push:
    branches: [verify/style-gallery-seven-pairs-20261111]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate live gallery API and sample photos
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            'https://api.magicaistudio.co.kr/api/style-gallery' -o /tmp/gallery.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/gallery.json'))
          items=data.get('items',[])
          keys=[str(x.get('pairKey','')) for x in items]
          print('Style gallery live pair count:',len(items))
          print('Pair keys:',','.join(sorted(keys)))
          assert len(keys)==len(set(keys)), 'Duplicated pair keys'
          missing=[str(i) for i in range(1,8) if str(i) not in keys]
          assert not missing, 'Missing pair keys: '+str(missing)
          for item in items:
            k=str(item.get('pairKey',''))
            assert f'/original/{k}.' in item['originalUrl'], item
            assert f'/result/{k}f.' in item['resultUrl'], item
          print('All 7 before/after pairs served by production API')
          PY
          for n in 1 2 3 4 5 6 7; do
            original="https://rzlvfuyzofzqghzooqsi.supabase.co/storage/v1/render/image/public/samples/original/${n}.jpg?width=720&quality=75"
            result="https://rzlvfuyzofzqghzooqsi.supabase.co/storage/v1/render/image/public/samples/result/${n}f.jpg?width=720&quality=75"
            curl --fail --silent --show-error --head --max-time 15 "$original" -o /dev/null
            curl --fail --silent --show-error --head --max-time 15 "$result" -o /dev/null
          done
