<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>카카오 로그인 안내 | Magic AI Studio</title>
  <style>
    :root {color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;}
    *{box-sizing:border-box;}
    body{margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; background:linear-gradient(145deg,#fff6f9,#f8f8fa); color:#1d2430;}
    main{width:min(100%,440px); background:#fff; border:1px solid #f3e4e9; border-radius:24px; padding:38px 28px; box-shadow:0 18px 55px rgba(92,52,72,.08); text-align:center;}
    .brand{font-size:15px; color:#ee447e; font-weight:800; letter-spacing:-.04em;}
    .icon{display:grid; place-items:center; width:56px; height:56px; margin:26px auto 17px; border-radius:50%; background:#fff1f5; color:#a6556d; font-size:30px;}
    h1{font-size:23px; line-height:1.4; letter-spacing:-.06em; margin:0 0 13px;}
    p{font-size:14px; color:#667085; line-height:1.9; margin:0;}
    .hint{margin:21px 0 25px; background:#fcf8fa; border-radius:14px; padding:15px 14px; text-align:left; font-size:13px; line-height:1.8; color:#765c68;}
    a{display:block; text-decoration:none; padding:15px 18px; border-radius:14px; font-size:14px; font-weight:700;}
    .primary{background:#fa3f83; color:#fff;}
    .secondary{margin-top:10px; border:1px solid #ece8eb; color:#744f60; background:#fff;}
  </style>
</head>
<body>
  <main>
    <div class="brand">Magic AI Studio</div>
    <div class="icon" aria-hidden="true">!</div>
    <h1>이 카카오 계정으로 가입한<br>내역이 없어요</h1>
    <p>카카오 인증은 완료됐지만, 이 계정에 연결된<br>Magic AI Studio 회원정보를 찾지 못했어요.</p>
    <div class="hint">다른 기기에서는 로그인된다면 <strong>카카오 계정이 서로 다른지</strong> 확인해 주세요. 기존 회원은 이전에 사용한 카카오·네이버·구글 계정으로 로그인할 수 있어요.</div>
    <a class="primary" href="/">사이트로 돌아가 다시 로그인하기</a>
    <a class="secondary" href="/">새 계정으로 가입하려면 홈에서 회원가입 선택</a>
  </main>
</body>
</html>
